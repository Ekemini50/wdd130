<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting Company</title>
    <link rel="stylesheet" href="styles/example.css">
</head>

<body>

    <header class="site-header">
        <img src="images/logo.png" alt="Company Logo" class="logo">
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street<br>Kolob, California</p>
            <p><a href="tel:+19999999999">+1 999 999 9999</a></p>
            <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
        </section>

        <section class="contact-section">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d351.2960521037615!2d7.9160441082091255!3d5.028707215782348!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x105d57e266b1c453%3A0x30769a7283d92308!2sLeadway%20Christian%20Center!5e0!3m2!1sen!2sng!4v1791403048954!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

            <form class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <fieldset>
                    <legend>Message Purpose:</legend>
                    <label><input type="radio" name="purpose" value="general"> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website
                        Suggestion</label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>

                <label>
                    <input type="checkbox" name="subscribe"> Please subscribe me to the monthly
                    newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

    
    </main>

    
</body>

</html>
