<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="poll-form.cs">
</head>
<body>
    <header>

    </header>

    <main>
        <form>
            <label for="full name">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="useremail">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="edge">Edge</option>
                <option value="firefox">Firefox</option>
                <option value="safari">Safari</option>
                <option value="other">Other</option>
            </select>
            
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">

            <label for="feedback">Name the places you have lived:</label>
            <textarea name="feedback" id="feedback" rows="4" placeholder="Columbus Ohio, Timbuktu Mali"></textarea>
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>

    </footer>
    
</body>
</html>
