<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <main class="box">
        <h1>
            <address class="contact-info">
                <strong class="company-name">Kemi's Water Rafting Company</strong><br>
                <span class="street-address">13 Port Harcourt Street</span><br>
                <span class="city-state">Uyo, Akwa Ibom, Nigeria</span><br>
                Email: <a href="mailto:eenwon@byupathway.edu">eenwon@byupathway.edu</a><br>
                Phone: <a href="tel:+2348000000000" class="phone-link">+234 9165498491</a>
            </address>
        </h1>
            <form>
                <div class="quiz-item box">
                    <label>1. What is the full meaning of CSS? <input type="text" name="q1" id="q1"></label>
                </div>

                <div class="quiz-item box">
                    <label>2. How are id and class attributes selected in CSS? <input type="textarea" name="q2" id="q2"></label>
                </div>

                <div class="quiz-item box">
                    <label for="q3">3. Which of the following is a valid CSS comment?</label>
                    <select name="q3" id="q3">
                        <option value="" select disabled>Choose one ...</option>
                        <option value="a">A. </option>
                        <option value="b">B. </option>
                        <option value="c">C. </option>
                    </select>
                </div>

                <div class="quiz-item box">
                    <label for="q4">4. What is the bottom margin given this declaration? <code>margin: 10px 5px 15px;</code><input type="number" name="q4" id="q4"></label>
                </div>

                <button type="submit">Submit Quiz for Grading</button>


            </form>
    </main>
    
</body>
</html>
